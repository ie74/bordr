<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">

	<!-- Title -->
	<title>Image Border</title>
</head>
<body>
	<fieldset>
		<input type="file" id="file-input" multiple accept="image/*">

		<input type="number" value="30" id="border-input">

		<select id="ratio-input">
  			<option value="4:5" selected>4:5</option>
 			<option value="1:1">1:1</option>
  			<option value="4:3">4:3</option>
			<option value="original">Original</option>
		</select>

		<input type="color" id="color-input" value="#ffffff">
	</fieldset>

	<fieldset>
		<legend>Vertical images</legend>

		<label><input type="radio" name="v-mode" value="fit" checked> Fit (fit the image in the target ratio, no cropping)</label>
		<label><input type="radio" name="v-mode" value="cover"> Cover (crop the image to have a uniform border)</label>
		<label><input type="radio" name="v-mode" value="add"> Add (ignore the target ratio, add a uniform border around the original image)</label>
	</fieldset>

	<fieldset>
		<legend>Horizontal images</legend>

		<label><input type="radio" name="h-mode" value="fit" checked> Fit (fit the image in the target ratio, no cropping)</label>
		<label><input type="radio" name="h-mode" value="cover"> Cover (crop the image to have a uniform border)</label>
		<label><input type="radio" name="h-mode" value="add"> Add (ignore the target ratio, add a uniform border around the original image)</label>

		<label><input type="checkbox" id="slice-h-input">Split horizontals</label>
		<input type="range" min="2" max ="5" value="2" id="n-input">
		<span id="n-value">2</span>
	</fieldset>

	<div class="preview-container">
	</div>

	<button id="process-btn">Download</button>
	
	<!-- ZIP library -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script src="script.js"></script>
</body>
</html>
