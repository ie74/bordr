<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">

	<!-- Title -->
	<title>Bordr - Frame it right. Every time.</title>

	<!-- Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap"
		rel="stylesheet">

	<!-- Icons -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

	<!-- CSS -->
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<div class="hero-bg"></div>

	<div class="topbar">
		<div class="topbar-container">
			<a class="ie74-link" href="https:/ie74.github.io">ie74</a>
			<h1 class="app-name">Bordr</h1>
		</div>
	</div>

	<div class="hero-container">
		<div class="hero">
			<h1>Frame it right.<br>Every time.</h2>
				<p>Add perfect borders to your photos before posting</p>
		</div>

		<div id="drop-zone">
			<div class="drop-bg"></div>
			<h1>Drag & Drop your photos here</h1>
			<i class="bi bi-upload"></i>
			<p>Or <a id="hero-upload" href="#">upload files</a> instead</p>
		</div>
	</div>

	<div class="app-section">
		<div class="app-container">
			<div class="app-controls">
				<div class="general-settings-container">
					<fieldset>
						<label>
							<span>Border width</span>
							<input type="number" min="0" value="30" id="border-input">
						</label>

						<label>
							<span>Border color</span>
							<input type="color" id="color-input" value="#ffffff">
						</label>

						<label>
							<span>Target ratio</span>
							<select id="ratio-input">
								<option value="4:5" selected>4:5</option>
								<option value="1:1">1:1</option>
								<option value="3:4">3:4</option>
								<option value="4:3">4:3</option>
								<option value="16:9">16:9</option>
								<option value="9:16">9:16</option>
								<option value="original">Original</option>
							</select>
						</label>
					</fieldset>

					<fieldset>

						<label><input type="checkbox" id="slice-h-input">Split horizontals</label>
						<input type="range" min="2" max="5" value="2" id="n-input">
						<span id="n-value">2</span>
					</fieldset>
				</div>


				<div class="image-modes-container">
					<fieldset>
						<legend>Vertical images</legend>

						<label><input type="radio" name="v-mode" value="fit" checked> Fit <span>Fit the image in the
								target ratio, no cropping</span></label>
						<label><input type="radio" name="v-mode" value="cover"> Cover <span>Crop the image to have a
								uniform border</span></label>
						<label><input type="radio" name="v-mode" value="add"> Add <span>Ignore the target ratio, add a
								uniform border around the original image</span></label>
					</fieldset>

					<fieldset>
						<legend>Horizontal images</legend>

						<label><input type="radio" name="h-mode" value="fit" checked> Fit <span>Fit the image in the
								target ratio, no cropping</span></label>
						<label><input type="radio" name="h-mode" value="cover"> Cover <span>Crop the image to have a
								uniform border</span></label>
						<label><input type="radio" name="h-mode" value="add"> Add <span>Ignore the target ratio, add a
								uniform border around the original image</span></label>
					</fieldset>
				</div>
			</div>

			<div class="preview-container">
			</div>

			<button id="process-btn">Download</button>
		</div>
	</div>

	<!-- ZIP library -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script src="script.js"></script>
</body>

</html>
